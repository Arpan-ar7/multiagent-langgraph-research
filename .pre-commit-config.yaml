# Hooks run the project's own pinned tools through uv, so versions match uv.lock.
# Install once with: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: nbstripout
        name: strip notebook metadata (outputs kept for GitHub rendering)
        entry: uv run nbstripout --keep-output --keep-count
        language: system
        files: \.ipynb$
