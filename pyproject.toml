[project]
name = "multi-agent-research-system"
version = "0.1.0"
description = "Multi-agent AI research system: LangGraph-orchestrated planner, parallel researchers, fact-checker, writer and critic that produce cited research reports."
readme = "README.md"
authors = [
    { name = "Arpan Kumar Panda", email = "arpankumarpandaar7@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "arxiv>=4.1.0",
    "ddgs>=9.16.1",
    "fastapi>=0.164.0",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "langchain-groq>=1.2.0",
    "langchain-openrouter>=0.2.9",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langsmith>=0.14.12",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "sse-starlette>=3.7.0",
    "streamlit>=1.67.0",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
    "wikipedia>=1.4.0",
]

[project.scripts]
research = "research_system.cli:main"
research-eval = "research_system.evals.cli:main"
research-api = "research_system.api.app:run"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "research_system"

# ---------------------------------------------------------------- tooling ---

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["notebooks"]
force-exclude = true  # honour excludes even when pre-commit passes file paths

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that run the full graph with fake models",
    "live: tests that call real external APIs (need keys)",
]
addopts = "-m 'not live'"
# Pydantic serializer warnings signal invalid models (see test_checkpoint_roundtrip_keeps_nested_models)
filterwarnings = ["error::UserWarning"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "mypy>=2.4.1",
    "nbstripout>=0.9.2",
    "pandas>=3.1.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]
